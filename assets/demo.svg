<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" width="720" height="344" role="img" aria-label="Terminal frame: the user gives Codex a task to add a dark theme and lets it edit the files itself. The skill runs codex exec with the workspace-write sandbox, feeding the prompt from prompt.txt on stdin; Codex reports that it added a toggle and CSS variables across three files, and git diff --stat output shows changes in styles.css and index.html.">
  <rect x="0.5" y="0.5" width="719" height="343" rx="8" fill="#0d1117" stroke="#30363d"/>
  <path d="M0.5 8.5 A8 8 0 0 1 8.5 0.5 H711.5 A8 8 0 0 1 719.5 8.5 V32.5 H0.5 Z" fill="#161b22"/>
  <line x1="0.5" y1="32.5" x2="719.5" y2="32.5" stroke="#30363d"/>
  <circle cx="20" cy="16.5" r="5" fill="#ff5f57"/>
  <circle cx="38" cy="16.5" r="5" fill="#febc2e"/>
  <circle cx="56" cy="16.5" r="5" fill="#28c840"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12">
    <text x="360" y="21" fill="#8b949e" text-anchor="middle">claude code — hey-codex</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
    <text x="20" y="62" fill="#e6edf3"><tspan fill="#D97757" font-weight="bold">&gt; </tspan>give codex a task: add a dark theme, let it edit the files itself</text>

    <circle cx="23.5" cy="90" r="4" fill="#D97757"/>
    <text x="36" y="94" fill="#c9d1d9">Sending to Codex: dark theme for the landing page, file edits</text>

    <text x="36" y="122" fill="#8b949e"><tspan fill="#6e7681">$ </tspan><tspan fill="#c9d1d9">codex exec </tspan><tspan fill="#d29922">--sandbox workspace-write </tspan>-C . \</text>
    <text x="36" y="143" fill="#8b949e">     -o codex-task-1.md &lt; prompt.txt</text>
    <text x="36" y="167" fill="#6e7681">session id: 4b2e9f01…    tokens used: 31 205</text>

    <text x="20" y="203" fill="#D97757" font-weight="bold">Codex answer</text>
    <text x="20" y="226" fill="#c9d1d9">Added a toggle and CSS variables, the theme is remembered</text>
    <text x="20" y="247" fill="#c9d1d9">in localStorage. Touched 3 files.</text>

    <text x="20" y="279" fill="#8b949e"><tspan fill="#6e7681">$ </tspan><tspan fill="#c9d1d9">git diff --stat</tspan></text>
    <text x="20" y="300" fill="#8b949e"> styles.css | 42 <tspan fill="#3fb950">++++++++++++++</tspan><tspan fill="#f85149">--</tspan></text>
    <text x="20" y="321" fill="#8b949e"> index.html |  8 <tspan fill="#3fb950">++++++++</tspan></text>
  </g>
</svg>
